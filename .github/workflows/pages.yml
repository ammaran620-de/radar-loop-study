name: Reproduce study and publish dashboard
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: radar-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: 'requirements*.txt'
      - name: Install CPU research dependencies
        run: |
          python -m pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-validation.txt
      - name: Download public data and reproduce experiments
        run: python run_upgrade.py
      - name: Run numerical regression tests
        run: python -m unittest -v
      - name: Build recorded-result console
        run: python build_field_console.py
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Run interface interaction checks
        run: |
          npm ci --ignore-scripts
          npm test
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v4
